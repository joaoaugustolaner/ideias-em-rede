[project]
name = "ideias-em-rede"
version = "0.1.0"
description = "Projeto de ciência de dados para sumarização de textos em português."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Antônio Brum" },
    { name = "Arturo Souza" },
    { name = "Augusto Leal" },
    { name = "João Augusto T. Laner" },
]
dependencies = [
    "huggingface_hub>=0.24",
    "jupyterlab>=4.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "scikit-learn>=1.4",
    "seaborn>=0.13",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ideias_em_rede"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
